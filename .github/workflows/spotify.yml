name: Update Spotify debug

on:
  schedule:
    - cron: "*/6 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-spotify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Spotify status
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node .github/scripts/spotify.js

      - name: Commit changes
        run: |
          git config user.name "spotify-bot"
          git config user.email "spotify-bot@users.noreply.github.com"

          git add assets/spotify-now-playing.svg

          git diff --cached --quiet || git commit -m "♫ update now playing"

          git push
